<svg xmlns="http://www.w3.org/2000/svg" width="900" height="248" viewBox="16 16 900 248" role="img" aria-labelledby="title desc">
<title id="title">Flight Desk logo</title>
<desc id="desc">White aircraft ascending over a minimal desk-and-log icon on a rounded blue-to-purple square, followed by Flight Desk wordmark.</desc>
<defs>
  <linearGradient id="iconGradient" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#288CF1"/>
    <stop offset="56%" stop-color="#5854E9"/>
    <stop offset="100%" stop-color="#812EE2"/>
  </linearGradient>
  <linearGradient id="deskWord" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#A48BE0"/>
    <stop offset="100%" stop-color="#BDA7ED"/>
  </linearGradient>
</defs>
<!-- Fully transparent outer background -->
<rect x="20" y="20" width="240" height="240" rx="57" fill="url(#iconGradient)"/>
<!-- Airplane: intentionally simplified, solid white silhouette -->
<path d="M69 119 L96 100 L146 100 L181 72 Q194 62 203 67 Q214 73 203 84 L139 139 Q129 147 117 147 L70 147 Q63 147 61 142 Q59 137 67 132 L89 119 Z" fill="#fff"/>
<!-- Desk plus log sheet, reduced to recognizable geometric forms -->
<path d="M63 165 H174 V135 Q174 130 180 130 H212 Q219 130 219 137 V185 Q219 194 210 194 H63 Q55 194 55 186 V173 Q55 165 63 165 Z" fill="#fff"/>
<rect x="69" y="194" width="15" height="35" rx="6" fill="#fff"/>
<rect x="195" y="194" width="15" height="35" rx="6" fill="#fff"/>
<path d="M186 146 H205 M186 162 H205" stroke="#6650E9" stroke-width="6" stroke-linecap="round"/>
<!-- Brand wordmark. Font family remains editable vector text in the SVG. -->
<text x="296" y="178" font-family="Arial, Helvetica, sans-serif" font-size="117" font-weight="700" letter-spacing="-4" fill="#F5F5F5">Flight</text>
<text x="637" y="178" font-family="Arial, Helvetica, sans-serif" font-size="117" font-weight="700" letter-spacing="-4" fill="url(#deskWord)">Desk</text>
</svg>
