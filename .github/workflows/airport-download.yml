name: Download Global Airport CSV

# The initial feature-branch push creates a downloadable run without requiring
# this workflow to be registered on main. Later, use Re-run all jobs on that run.
on:
  push:
    branches: [feature/supabase-auth]
    paths: [.github/workflows/airport-download.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-download:
    if: github.ref == 'refs/heads/feature/supabase-auth'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned preparation tools
        run: python -m pip install -r scripts/airports/requirements.txt
      - name: Test preparation logic (no database)
        run: python -m unittest discover -s scripts/airports -p 'test_*.py' -v
      - name: Prepare pinned airport and geographic timezone data (no database)
        run: python scripts/airports/prepare.py --output .airport-data/download
      - name: Verify generated files against the reviewed snapshot
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          bundle = Path('.airport-data/download')
          reviewed = json.loads(Path('docs/airport-import-review/manifest.json').read_text())
          generated = json.loads((bundle / 'manifest.json').read_text())
          for field in ('sources', 'packages', 'iana_version', 'script_sha256', 'files'):
              if generated[field] != reviewed[field]:
                  raise SystemExit(f'Reviewed snapshot mismatch: {field}; refusing upload')
          for name, expected in reviewed['files'].items():
              actual = hashlib.sha256((bundle / name).read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f'File checksum mismatch: {name}; refusing upload')
          report = json.loads((bundle / 'report.json').read_text())
          if report['database_connections'] != 0 or report['database_writes'] != 0:
              raise SystemExit('Not a dry run; refusing upload')
          print('Reviewed CSV verified:', report['valid']['records'], 'records')
          PY
      - name: Upload downloadable bundle (no source polygons or credentials)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flightdesk-global-airports
          path: |
            .airport-data/download/airports.csv
            .airport-data/download/airports.jsonl
            .airport-data/download/sample.jsonl
            .airport-data/download/issues.jsonl
            .airport-data/download/report.json
            .airport-data/download/manifest.json
            .airport-data/download/NOTICE.md
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
          include-hidden-files: true
